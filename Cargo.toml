[package]
name = "jutella-xmpp"
description = "XMPP – OpenAI API bridge"
license = "MIT"
repository = "https://github.com/dmitry-markin/jutella-xmpp"
version = "0.3.1"
edition = "2021"

[[bin]]
name = "jutellaxmpp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
jutella = { git = "https://github.com/dmitry-markin/jutella.git", branch = "update-deps", default-features = false }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio-xmpp = "6.0.0"
xmpp-parsers = "0.23.0"
rustls = "0.23.46"
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["gzip", "json", "hickory-dns", "http2", "multipart", "rustls", "zstd" ] }
tokio-stream = "0.1.19"
tiktoken-rs = "0.12.1"
wildmatch = "2.7.0"
base64 = "0.23.1"
thiserror = "2.0.21"
rxml = "0.14.0"
serde_json = "1.0.154"
url = "2.5.8"
